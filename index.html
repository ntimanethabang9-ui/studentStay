<!DOCTYPE html>
<html>
<head>
    <title>StudentStay</title>
</head>

<body>

    <h1>StudentStay</h1>

    <p>Find affordable student accommodation.</p>

    <h2>Search</h2>

    <input id="searchInput" type="text" placeholder="Enter location">

    <button onclick="searchAccommodation()">Search</button>

    <div id="result"></div>

    <script>

        function searchAccommodation() {

            let location = document.getElementById("searchInput").value;

            document.getElementById("result").innerHTML =
                "You searched for: " + location;

        }

    </script>

</body>
</html>
