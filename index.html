<!DOCTYPE html>
<html>
<head>
    <title>StudentStay</title>
</head>

<body>

    <h1>StudentStay</h1>

    <p>Find affordable student accommodation.</p>
<div class="search-box">
    <input type="text" id="searchInput" placeholder="Enter your campus or location">

    <button type="button" onclick="searchAccommodation()">Search</button>
</div>

<script>
function searchAccommodation() {

    let search = document.getElementById("searchInput").value.toLowerCase().trim();

    let cards = document.querySelectorAll(".card");

    cards.forEach(function(card) {

        let information = card.textContent.toLowerCase();

        if (search === "" || information.includes(search)) {
            card.style.display = "";
        } else {
            card.style.display = "none";
        }

    });
}
</script>
</body>
</html>
