<body>

<header>

<a href="index.html" class="logo">
StudentStay
</a>

</header>


<div class="container">

<div class="booking-box">

<h1>Confirm Booking</h1>

<p class="subtitle">
Complete your booking below.
</p>


<div id="loading">

<p style="text-align:center;">
Loading accommodation...
</p>

</div>


<div
id="bookingContent"
style="display:none;"
>


<div class="info">

<h2 id="accommodationName"></h2>

<p id="accommodationLocation"></p>

<p id="accommodationPrice"></p>

<p id="accommodationFeatures"></p>

</div>


<form onsubmit="confirmBooking(event)">


<label>
Move-in Date
</label>

<input
type="date"
id="moveInDate"
required
>


<label>
Message
</label>

<textarea
id="message"
placeholder="Optional message to the owner"
></textarea>


<button
type="submit"
class="confirm-button"
>
Confirm Booking
</button>


</form>

</div>


<div
id="statusMessage"
class="message"
></div>


<button
class="back-button"
onclick="window.location.href='index.html'"
>
Back to Accommodation
</button>


</div>

<script>


/* GET ID FROM URL */

const urlParams =
new URLSearchParams(
window.location.search
);

let accommodationId =
urlParams.get("id");


/* IF URL DOES NOT HAVE ID,
   CHECK LOCAL STORAGE */

if (!accommodationId) {

    accommodationId =
    localStorage.getItem(
        "bookingAccommodationId"
    );

}


/* CONVERT TO NUMBER */

accommodationId =
Number(accommodationId);


/* LOAD ACCOMMODATION */

async function loadAccommodation() {


    if (!accommodationId) {

        showError(
            "No accommodation was selected."
        );

        return;

    }


    console.log(
        "Accommodation ID:",
        accommodationId
    );


    const result =
    await supabaseClient
        .from("accommodations")
        .select("*")
        .eq("id", accommodationId);


    console.log(
        "Supabase result:",
        result
    );


    if (result.error) {

        showError(
            "Could not load accommodation: " +
            result.error.message
        );

        return;

    }


    if (
        !result.data ||
        result.data.length === 0
    ) {

        showError(
            "Accommodation was not found in the database."
        );

        return;

    }


    /* TAKE FIRST ROW */

    const accommodation =
    result.data[0];


    /* SHOW INFORMATION */

    document.getElementById(
        "accommodationName"
    ).textContent =
    accommodation.name;


    document.getElementById(
        "accommodationLocation"
    ).textContent =
    "📍 " +
    accommodation.location;


    document.getElementById(
        "accommodationPrice"
    ).textContent =
    "💰 R" +
    accommodation.price +
    " / month";


    document.getElementById(
        "accommodationFeatures"
    ).textContent =
    "🏠 " +
    (
        accommodation.features ||
        "Facilities not specified"
    );


    /* SAVE ID */

    localStorage.setItem(
        "bookingAccommodationId",
        accommodation.id
    );


    /* SHOW PAGE */

    document.getElementById(
        "loading"
    ).style.display =
    "none";


    document.getElementById(
        "bookingContent"
    ).style.display =
    "block";

}


/* CONFIRM BOOKING */

async function confirmBooking(event) {

    event.preventDefault();


    const status =
    document.getElementById(
        "statusMessage"
    );


    /* CHECK LOGIN */

    const userResult =
    await supabaseClient.auth.getUser();


    if (
        userResult.error ||
        !userResult.data.user
    ) {

        status.textContent =
        "Please login before making a booking.";

        status.style.color =
        "red";

        return;

    }


    const user =
    userResult.data.user;


    const moveInDate =
    document.getElementById(
        "moveInDate"
    ).value;


    const message =
    document.getElementById(
        "message"
    ).value;


    status.textContent =
    "Confirming booking...";

    status.style.color =
    "#2563eb";


    /* INSERT BOOKING */

    const booking =
    await supabaseClient
        .from("bookings")
        .insert({

            student_id:
            user.id,

            accommodation_id:
            accommodationId,

            nove_in_date:
            moveInDate,

            nessage:
            message || null,

            status:
            "Confirmed"

        });


    if (booking.error) {

        console.error(
            booking.error
        );


        status.textContent =
        "Booking failed: " +
        booking.error.message;

        status.style.color =
        "red";

        return;

    }


    /* SUCCESS */

    status.textContent =
    "Booking confirmed successfully!";

    status.style.color =
    "green";


    setTimeout(function() {

        window.location.href =
        "dashboard.html";

    }, 1200);

}


/* ERROR MESSAGE */

function showError(message) {

    document.getElementById(
        "loading"
    ).style.display =
    "none";


    const status =
    document.getElementById(
        "statusMessage"
    );


    status.textContent =
    message;

    status.style.color =
    "red";

}


/* START */

loadAccommodation();

</script>

</body>

</html>
