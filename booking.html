<body>


<header>

    <a href="index.html" class="logo">
        StudentStay
    </a>

</header>


<div class="container">

    <div class="booking-box">

        <h1>Confirm Booking</h1>

        <p class="subtitle">
            Complete the information below to confirm your accommodation.
        </p>


        <div
            id="loading"
            class="loading"
        >
            Loading accommodation...
        </div>


        <div
            id="bookingContent"
            style="display:none;"
        >

            <div class="accommodation-info">

                <h2 id="accommodationName"></h2>

                <p id="accommodationLocation"></p>

                <p id="accommodationPrice"></p>

                <p id="accommodationFeatures"></p>

            </div>


            <form onsubmit="confirmBooking(event)">

                <label>
                    Move-in Date
                </label>

                <input
                    type="date"
                    id="moveInDate"
                    required
                >


                <label>
                    Message
                </label>

                <textarea
                    id="message"
                    placeholder="Add a message to the accommodation owner (optional)"
                ></textarea>


                <button
                    type="submit"
                    class="confirm-button"
                >
                    Confirm Booking
                </button>

            </form>

        </div>


        <div
            id="statusMessage"
            class="message"
        ></div>


        <button
            class="back-button"
            onclick="window.location.href='index.html'"
        >
            Back to Accommodation
        </button>

    </div>

</div>


<script>

let accommodationId = null;
let accommodation = null;


/* GET ACCOMMODATION ID */

const urlParams =
    new URLSearchParams(window.location.search);

const idFromUrl =
    urlParams.get("id");


if (idFromUrl) {

    accommodationId =
        Number(idFromUrl);

} else {

    accommodationId =
        Number(
            localStorage.getItem(
                "bookingAccommodationId"
            )
        );

}


/* LOAD ACCOMMODATION */
```javascript
async function loadAccommodation() {

    if (!accommodationId) {

        showError(
            "No accommodation was selected."
        );

        return;

    }


    console.log(
        "Looking for accommodation ID:",
        accommodationId
    );


    const {
        data,
        error
    } =
        await supabaseClient
            .from("accommodations")
            .select("*")
            .eq("id", accommodationId);


    console.log("Supabase result:", data);
    console.log("Supabase error:", error);


    if (error) {

        console.error(error);

        showError(
            "Could not load accommodation: " +
            error.message
        );

        return;

    }


    if (!data || data.length === 0) {

        showError(
            "Accommodation was not found in the database."
        );

        return;

    }


    accommodation =
        data[0];


    document.getElementById(
        "accommodationName"
    ).textContent =
        accommodation.name;


    document.getElementById(
        "accommodationLocation"
    ).textContent =
        "📍 " +
        accommodation.location;


    document.getElementById(
        "accommodationPrice"
    ).textContent =
        "💰 R" +
        accommodation.price +
        " / month";


    document.getElementById(
        "accommodationFeatures"
    ).textContent =
        "🏠 " +
        (
            accommodation.features ||
            "Facilities not specified"
        );


    document.getElementById(
        "loading"
    ).style.display =
        "none";


    document.getElementById(
        "bookingContent"
    ).style.display =
        "block";

}
```



/* CONFIRM BOOKING */

async function confirmBooking(event) {

    event.preventDefault();


    const statusMessage =
        document.getElementById(
            "statusMessage"
        );


    const {
        data: {
            user
        },
        error: userError
    } =
        await supabaseClient.auth.getUser();


    if (userError || !user) {

        statusMessage.textContent =
            "Please login before booking.";

        statusMessage.style.color =
            "red";

        return;

    }


    const moveInDate =
        document.getElementById(
            "moveInDate"
        ).value;


    const message =
        document.getElementById(
            "message"
        ).value;


    if (!moveInDate) {

        statusMessage.textContent =
            "Please select a move-in date.";

        statusMessage.style.color =
            "red";

        return;

    }


    statusMessage.textContent =
        "Confirming booking...";

    statusMessage.style.color =
        "#2563eb";


    /*
        IMPORTANT:

        Your Supabase bookings table uses:

        student_id
        accommodation_id
        nove_in_date
        nessage
        status

        We therefore insert the accommodation ID,
        NOT the accommodation name.
    */


    const bookingData = {

        student_id: user.id,

        accommodation_id:
            accommodation.id,

        nove_in_date:
            moveInDate,

        nessage:
            message || null,

        status:
            "Confirmed"

    };


    const {
        data,
        error
    } =
        await supabaseClient
            .from("bookings")
            .insert([
                bookingData
            ])
            .select();


    if (error) {

        console.error(
            "Booking error:",
            error
        );


        statusMessage.textContent =
            "Booking failed: " +
            error.message;

        statusMessage.style.color =
            "red";

        return;

    }


    statusMessage.textContent =
        "Booking confirmed successfully!";

    statusMessage.style.color =
        "green";


    setTimeout(function() {

        window.location.href =
            "dashboard.html";

    }, 1200);

}


/* ERROR */

function showError(message) {

    document.getElementById(
        "loading"
    ).style.display =
        "none";


    document.getElementById(
        "bookingContent"
    ).style.display =
        "none";


    const status =
        document.getElementById(
            "statusMessage"
        );


    status.textContent =
        message;

    status.style.color =
        "red";

}


loadAccommodation();

</script>
