<body>

<header>

    <a href="index.html" class="logo">
        StudentStay
    </a>

</header>


<div class="container">

    <div class="booking-box">

        <h1>Confirm Your Booking</h1>

        <p class="subtitle">
            Complete the details below to confirm your accommodation.
        </p>


        <div class="accommodation-info">

            <h2 id="accommodationName">
                Loading...
            </h2>

            <p id="accommodationLocation">
                📍 Loading...
            </p>

            <p id="accommodationPrice">
                💰 Loading...
            </p>

        </div>


        <form onsubmit="confirmBooking(event)">

            <label>
                Move-in Date
            </label>

            <input
                type="date"
                id="moveInDate"
                required
            >


            <label>
                Message to Accommodation Owner
            </label>

            <textarea
                id="message"
                placeholder="Write a message to the accommodation owner (optional)"
            ></textarea>


            <button
                type="submit"
                class="confirm-button"
                id="confirmButton"
            >
                Confirm Booking
            </button>

        </form>


        <div
            id="messageBox"
            class="message"
        ></div>


        <a
            href="index.html#accommodation"
            class="back-button"
        >
            ← Back to Accommodation
        </a>

    </div>

</div>


<script>

let selectedName =
    localStorage.getItem("bookingName");

let selectedLocation =
    localStorage.getItem("bookingLocation");

let selectedPrice =
    localStorage.getItem("bookingPrice");


/* DISPLAY SELECTED ACCOMMODATION */

document.getElementById("accommodationName")
    .textContent =
    selectedName || "Accommodation";


document.getElementById("accommodationLocation")
    .textContent =
    selectedLocation || "📍 Location not available";


document.getElementById("accommodationPrice")
    .textContent =
    selectedPrice || "💰 Price not available";


/* SET MINIMUM DATE TO TODAY */

let today =
    new Date().toISOString().split("T")[0];

document.getElementById("moveInDate").min =
    today;


/* CONFIRM BOOKING */

async function confirmBooking(event) {

    event.preventDefault();


    let messageBox =
        document.getElementById("messageBox");

    let confirmButton =
        document.getElementById("confirmButton");


    messageBox.textContent = "";
    messageBox.className = "message";


    confirmButton.disabled = true;
    confirmButton.textContent = "Confirming...";


    try {

        /* GET LOGGED-IN USER */

        const {
            data: { user },
            error: userError
        } = await supabaseClient.auth.getUser();


        if (userError) {
            throw userError;
        }


        if (!user) {

            throw new Error(
                "You must be logged in before making a booking."
            );

        }


        /* GET ACCOMMODATION FROM DATABASE */

        const {
            data: accommodation,
            error: accommodationError
        } = await supabaseClient
            .from("accommodations")
            .select("id, name, location, price")
            .eq("name", selectedName)
            .limit(1)
            .maybeSingle();


        if (accommodationError) {
            throw accommodationError;
        }


        if (!accommodation) {

            throw new Error(
                "The selected accommodation could not be found."
            );

        }


        /* GET FORM DATA */

        let moveInDate =
            document.getElementById("moveInDate").value;

        let ownerMessage =
            document.getElementById("message").value;


        /*
           INSERT INTO BOOKINGS

           Your database columns are:

           id
           student_id
           accommodation_id
           nove_in_date
           nessage
           status
        */

        const {
            data: booking,
            error: bookingError
        } = await supabaseClient
            .from("bookings")
            .insert([

                {
                    student_id: user.id,

                    accommodation_id:
                        accommodation.id,

                    nove_in_date:
                        moveInDate,

                    nessage:
                        ownerMessage || null,

                    status:
                        "Confirmed"
                }

            ])
            .select()
            .single();


        if (bookingError) {
            throw bookingError;
        }


        /* SAVE BOOKING LOCALLY AS BACKUP */

        let savedBookings =
            JSON.parse(
                localStorage.getItem("studentBookings")
            ) || [];


        savedBookings.push({

            id: booking.id,

            name:
                accommodation.name,

            location:
                accommodation.location,

            price:
                "R" + accommodation.price + " / month",

            date:
                moveInDate,

            message:
                ownerMessage || "No message",

            status:
                "Confirmed"

        });


        localStorage.setItem(
            "studentBookings",
            JSON.stringify(savedBookings)
        );


        /* SUCCESS */

        messageBox.textContent =
            "Booking confirmed successfully!";

        messageBox.className =
            "message success";


        confirmButton.textContent =
            "Booking Confirmed";


        /*
           GO TO DASHBOARD
           AFTER A SHORT DELAY
        */

        setTimeout(function() {

            window.location.href =
                "dashboard.html";

        }, 1200);


    } catch (error) {

        console.error(
            "Booking error:",
            error
        );


        messageBox.textContent =
            error.message ||
            "Something went wrong while confirming your booking.";

        messageBox.className =
            "message error";


        confirmButton.disabled = false;

        confirmButton.textContent =
            "Confirm Booking";

    }

}

</script>
