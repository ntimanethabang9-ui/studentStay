<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>StudentStay | My Bookings</title>


    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f7fb;
            color: #1f2937;
        }


        header {
            background: white;
            padding: 18px 7%;

            display: flex;
            justify-content: space-between;
            align-items: center;

            box-shadow:
                0 2px 12px rgba(0,0,0,0.08);
        }


        .logo {
            color: #2563eb;
            font-size: 27px;
            font-weight: bold;
        }


        .home-button {
            text-decoration: none;
            background: #2563eb;
            color: white;

            padding: 10px 18px;

            border-radius: 7px;

            font-weight: bold;
        }


        .container {
            max-width: 900px;
            margin: 50px auto;
            padding: 20px;
        }


        h1 {
            text-align: center;
            color: #2563eb;
            margin-bottom: 10px;
        }


        .subtitle {
            text-align: center;
            color: #6b7280;
            margin-bottom: 35px;
        }


        /* BOOKING CARD */

        .booking-card {
            background: white;

            padding: 30px;

            border-radius: 14px;

            box-shadow:
                0 5px 20px rgba(0,0,0,0.08);

            margin-bottom: 25px;
        }


        .booking-header {
            display: flex;
            justify-content: space-between;
            align-items: center;

            margin-bottom: 20px;
        }


        .booking-header h2 {
            color: #2563eb;
        }


        .status {
            background: #dcfce7;
            color: #166534;

            padding: 8px 14px;

            border-radius: 20px;

            font-weight: bold;
        }


        .booking-info {
            margin-bottom: 12px;

            font-size: 16px;

            line-height: 1.5;
        }


        .booking-info strong {
            color: #111827;
        }


        .message {
            background: #f5f7fb;

            padding: 15px;

            border-radius: 8px;

            margin-top: 8px;

            line-height: 1.5;
        }


        .divider {
            border: none;

            border-top:
                1px solid #e5e7eb;

            margin: 20px 0;
        }


        /* CANCEL BUTTON */

        .cancel-button {
            width: 100%;

            padding: 12px;

            border: none;

            border-radius: 8px;

            background: #dc2626;

            color: white;

            font-size: 15px;

            font-weight: bold;

            cursor: pointer;

            margin-top: 15px;
        }


        .cancel-button:hover {
            background: #b91c1c;
        }


        /* EMPTY */

        .no-booking {
            background: white;

            padding: 45px;

            text-align: center;

            border-radius: 14px;

            box-shadow:
                0 5px 20px rgba(0,0,0,0.08);
        }


        .no-booking h2 {
            margin-bottom: 10px;
        }


        .button {
            display: block;

            text-align: center;

            text-decoration: none;

            background: #2563eb;

            color: white;

            padding: 14px;

            border-radius: 8px;

            margin-top: 25px;

            font-weight: bold;
        }


        .button:hover {
            background: #1d4ed8;
        }


        @media (max-width: 650px) {

            header {
                flex-direction: column;
                gap: 15px;
            }


            .booking-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 12px;
            }

        }

    </style>

</head>


<body>


<header>

    <div class="logo">
        StudentStay
    </div>


    <a
        href="index.html"
        class="home-button"
    >
        Home
    </a>

</header>



<div class="container">


    <h1>
        My Bookings
    </h1>


    <p class="subtitle">
        View all your StudentStay accommodation bookings.
    </p>


    <div id="bookings"></div>


    <a
        href="index.html"
        class="button"
    >
        + Book Another Accommodation
    </a>


</div>



<script>

/* DISPLAY ALL BOOKINGS */

function showBookings() {


    let container =
        document.getElementById("bookings");


    /* GET BOOKINGS */

    let bookings =
        JSON.parse(
            localStorage.getItem("bookings")
        ) || [];


    /* NO BOOKINGS */

    if (bookings.length === 0) {

        container.innerHTML = `

            <div class="no-booking">

                <h2>
                    No Bookings Yet
                </h2>

                <p>
                    You have not booked any accommodation yet.
                </p>

            </div>

        `;

        return;

    }


    /* CLEAR CONTAINER */

    container.innerHTML = "";


    /* DISPLAY EVERY BOOKING */

    bookings.forEach(function(booking, index) {


        let card =
            document.createElement("div");


        card.className =
            "booking-card";


        card.innerHTML = `

            <div class="booking-header">

                <h2>
                    🏠 ${booking.accommodation}
                </h2>

                <span class="status">
                    ${booking.status} ✅
                </span>

            </div>


            <div class="booking-info">

                <strong>
                    📍 Location:
                </strong>

                ${booking.location}

            </div>


            <div class="booking-info">

                <strong>
                    💰 Price:
                </strong>

                ${booking.price}

            </div>


            <hr class="divider">


            <div class="booking-info">

                <strong>
                    👤 Student:
                </strong>

                ${booking.student}

            </div>


            <div class="booking-info">

                <strong>
                    📧 Email:
                </strong>

                ${booking.email}

            </div>


            <div class="booking-info">

                <strong>
                    📅 Move-in Date:
                </strong>

                ${booking.moveInDate}

            </div>


            <div class="booking-info">

                <strong>
                    💬 Message to Owner:
                </strong>


                <div class="message">

                    ${booking.message || "No message provided."}

                </div>

            </div>


            <button
                class="cancel-button"
                onclick="cancelBooking(${index})"
            >
                Cancel Booking
            </button>

        `;


        container.appendChild(card);

    });

}


/* CANCEL BOOKING */

function cancelBooking(index) {


    let bookings =
        JSON.parse(
            localStorage.getItem("bookings")
        ) || [];


    if (
        confirm(
            "Are you sure you want to cancel this booking?"
        )
    ) {


        /* REMOVE BOOKING */

        bookings.splice(index, 1);


        /* SAVE UPDATED LIST */

        localStorage.setItem(
            "bookings",
            JSON.stringify(bookings)
        );


        /* REFRESH PAGE */

        showBookings();

    }

}


/* LOAD BOOKINGS */

showBookings();

</script>


</body>

</html>
