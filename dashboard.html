<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>StudentStay | My Bookings</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f7fb;
            color: #1f2937;
        }

        header {
            background: white;
            padding: 18px 7%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
        }

        .logo {
            color: #2563eb;
            font-size: 27px;
            font-weight: bold;
        }

        .home-button {
            text-decoration: none;
            background: #2563eb;
            color: white;
            padding: 10px 18px;
            border-radius: 7px;
            font-weight: bold;
        }

        .container {
            max-width: 900px;
            margin: 50px auto;
            padding: 20px;
        }

        h1 {
            text-align: center;
            color: #2563eb;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #6b7280;
            margin-bottom: 30px;
        }

        .booking-card {
            background: white;
            padding: 30px;
            border-radius: 14px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
            margin-bottom: 25px;
        }

        .booking-card h2 {
            color: #2563eb;
            margin-bottom: 20px;
        }

        .booking-info {
            margin-bottom: 12px;
            font-size: 16px;
        }

        .booking-info strong {
            color: #111827;
        }

        .status {
            display: inline-block;
            background: #dcfce7;
            color: #166534;
            padding: 8px 14px;
            border-radius: 20px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .message {
            background: #f5f7fb;
            padding: 15px;
            border-radius: 8px;
            margin-top: 10px;
        }

        .no-booking {
            background: white;
            padding: 40px;
            text-align: center;
            border-radius: 14px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        .no-booking h2 {
            margin-bottom: 10px;
        }

        .button {
            display: block;
            text-align: center;
            text-decoration: none;
            background: #2563eb;
            color: white;
            padding: 14px;
            border-radius: 8px;
            margin-top: 25px;
            font-weight: bold;
        }

        @media (max-width: 650px) {

            header {
                flex-direction: column;
                gap: 15px;
            }

        }

    </style>

</head>

<body>

<header>

    <div class="logo">
        StudentStay
    </div>

    <a href="index.html" class="home-button">
        Home
    </a>

</header>


<div class="container">

    <h1>
        My Bookings
    </h1>

    <p class="subtitle">
        View your StudentStay accommodation bookings.
    </p>


    <div id="bookings"></div>


    <a href="index.html" class="button">
        Find Another Accommodation
    </a>

</div>


<script>

function showBookings() {

    let bookingsContainer =
        document.getElementById("bookings");


    let bookingName =
        localStorage.getItem("bookingName");

    let bookingLocation =
        localStorage.getItem("bookingLocation");

    let bookingPrice =
        localStorage.getItem("bookingPrice");

    let studentName =
        localStorage.getItem("bookingStudent");

    let studentEmail =
        localStorage.getItem("bookingEmail");

    let bookingDate =
        localStorage.getItem("bookingDate");

    let bookingMessage =
        localStorage.getItem("bookingMessage");

    let bookingStatus =
        localStorage.getItem("bookingStatus");


    /* CHECK IF THERE IS A BOOKING */

    if (!bookingName) {

        bookingsContainer.innerHTML = `

            <div class="no-booking">

                <h2>No Bookings Yet</h2>

                <p>
                    You have not booked any accommodation yet.
                </p>

            </div>

        `;

        return;
    }


    /* DISPLAY BOOKING */

    bookingsContainer.innerHTML = `

        <div class="booking-card">

            <div class="status">
                ${bookingStatus || "Confirmed"} ✅
            </div>

            <h2>
                🏠 ${bookingName}
            </h2>

            <div class="booking-info">
                <strong>📍 Location:</strong>
                ${bookingLocation || "-"}
            </div>

            <div class="booking-info">
                <strong>💰 Price:</strong>
                ${bookingPrice || "-"}
            </div>

            <hr style="margin: 20px 0; border: none; border-top: 1px solid #e5e7eb;">

            <div class="booking-info">
                <strong>👤 Student:</strong>
                ${studentName || "-"}
            </div>

            <div class="booking-info">
                <strong>📧 Email:</strong>
                ${studentEmail || "-"}
            </div>

            <div class="booking-info">
                <strong>📅 Move-in Date:</strong>
                ${bookingDate || "-"}
            </div>

            <div class="booking-info">
                <strong>💬 Message:</strong>

                <div class="message">
                    ${bookingMessage || "No message provided."}
                </div>

            </div>

        </div>

    `;

}


/* LOAD BOOKINGS */

showBookings();

</script>

</body>

</html>
