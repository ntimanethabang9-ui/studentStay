<script>


document
.getElementById("registerForm")
.addEventListener(
    "submit",
    registerUser
);


async function registerUser(event) {

    event.preventDefault();


    const message =
        document.getElementById(
            "message"
        );


    const button =
        document.getElementById(
            "registerButton"
        );


    const name =
        document.getElementById(
            "name"
        ).value.trim();


    const email =
        document.getElementById(
            "email"
        ).value.trim();


    const phone =
        document.getElementById(
            "phone"
        ).value.trim();


    const studentNumber =
        document.getElementById(
            "studentNumber"
        ).value.trim();


    const university =
        document.getElementById(
            "university"
        ).value.trim();


    const password =
        document.getElementById(
            "password"
        ).value;


    const confirmPassword =
        document.getElementById(
            "confirmPassword"
        ).value;


    /* CHECK PASSWORD */

    if (
        password !==
        confirmPassword
    ) {

        message.textContent =
            "Passwords do not match.";

        message.style.color =
            "red";

        return;

    }


    if (password.length < 6) {

        message.textContent =
            "Password must be at least 6 characters.";

        message.style.color =
            "red";

        return;

    }


    button.disabled = true;

    button.textContent =
        "Creating Account...";

    message.textContent =
        "";


    try {


        /* CREATE AUTH ACCOUNT */

        const {
            data: authData,
            error: authError
        } =
        await supabaseClient.auth.signUp({

            email: email,

            password: password,

            options: {

                data: {

                    full_name: name,

                    phone: phone,

                    student_number:
                        studentNumber,

                    university:
                        university

                }

            }

        });


        if (authError) {

            throw authError;

        }


        if (
            !authData ||
            !authData.user
        ) {

            throw new Error(
                "Account could not be created."
            );

        }


        const user =
            authData.user;


      const {
    error: profileError
} = await supabaseClient
    .from("profiles")
    .insert({
        id: user.id,
        name: name,
        email: email,
        phone: phone,
        student_number: studentNumber,
        university: university
    }); 

        if (profileError) {

            console.error(
                "Profile error:",
                profileError
            );


            message.textContent =
                "Account created, but your profile could not be saved: " +
                profileError.message;

            message.style.color =
                "red";

            button.disabled = false;

            button.textContent =
                "Create Account";

            return;

        }


        /* SUCCESS */

        message.textContent =
            "Account created successfully!";

        message.style.color =
            "green";


        /*
        If email confirmation is enabled,
        there will be no active session yet.
        */

        if (
            authData.session === null
        ) {

            message.textContent =
                "Account created! Please check your email to confirm your account.";

            message.style.color =
                "green";


            setTimeout(function() {

                window.location.href =
                    "login.html";

            }, 2500);


        } else {


            setTimeout(function() {

                window.location.href =
                    "dashboard.html";

            }, 1200);

        }


    } catch (error) {

        console.error(
            "Registration error:",
            error
        );


        message.textContent =
            error.message ||
            "Registration failed.";

        message.style.color =
            "red";


        button.disabled =
            false;

        button.textContent =
            "Create Account";

    }

}

</script>
