<style>

* {
    box-sizing: border-box;
    margin: 0;

    font-family: Arial, sans-serif;

<body>

<header>

<div class="logo">
StudentStay Owner
</div>

<button
class="logout"
onclick="logout()"
>
Logout
</button>

</header>


<div class="container">

<h1>
Owner Dashboard
</h1>

<p class="subtitle">
Add and manage your accommodation listings and bookings.
</p>


<!-- ADD ACCOMMODATION -->

<div class="box">

<h2>
Add Accommodation
</h2>

<label>
Accommodation Name
</label>

<input
type="text"
id="name"
placeholder="e.g. Student Residence"
>

<label>
Location
</label>

<input
type="text"
id="location"
placeholder="e.g. Soshanguve"
>

<label>
Monthly Price
</label>

<input
type="number"
id="price"
placeholder="e.g. 3500"
>

<label>
Features
</label>

<textarea
id="features"
placeholder="e.g. Wi-Fi, Security, Furnished"
></textarea>

<label>
Image URL
</label>

<input
type="url"
id="image_url"
placeholder="https://example.com/image.jpg"
>

<button
class="add-button"
onclick="addAccommodation()"
>
Add Accommodation
</button>

<div
id="message"
class="message"
></div>

</div>


<!-- MY ACCOMMODATION -->

<div class="box">

<h2>
My Accommodation
</h2>

<div
id="properties"
class="properties"
>

<p class="empty">
Loading your properties...
</p>

</div>

</div>


<!-- BOOKINGS -->

<div class="box">

<h2>
📋 Student Bookings
</h2>

<div id="bookings">

<p class="empty">
Loading bookings...
</p>

</div>

</div>


</div>


<script>

let currentUser = null;


/* CHECK LOGIN */

async function checkUser() {

    const {
        data,
        error
    } =
    await supabaseClient
        .auth
        .getUser();

    if (
        error ||
        !data.user
    ) {

        window.location.href =
            "login.html";

        return;

    }

    currentUser =
        data.user;

    await loadProperties();

    await loadBookings();

}


/* ADD ACCOMMODATION */

async function addAccommodation() {

    if (!currentUser) {

        alert(
            "Please login first."
        );

        return;

    }

    const name =
        document
        .getElementById("name")
        .value
        .trim();

    const location =
        document
        .getElementById("location")
        .value
        .trim();

    const price =
        document
        .getElementById("price")
        .value;

    const features =
        document
        .getElementById("features")
        .value
        .trim();

    const image_url =
        document
        .getElementById("image_url")
        .value
        .trim();

    const message =
        document
        .getElementById("message");

    if (
        !name ||
        !location ||
        !price
    ) {

        message.textContent =
            "Please fill in the accommodation name, location and price.";

        message.style.color =
            "red";

        return;

    }

    message.textContent =
        "Adding accommodation...";

    message.style.color =
        "#2563eb";

    const {
        error
    } =
    await supabaseClient
        .from("accommodations")
        .insert({

            name: name,

            location: location,

            price: Number(price),

            features: features,

            image_url:
                image_url || null,

            owner_id:
                currentUser.id

        });

    if (error) {

        console.error(error);

        message.textContent =
            "Could not add accommodation: " +
            error.message;

        message.style.color =
            "red";

        return;

    }

    message.textContent =
        "Accommodation added successfully!";

    message.style.color =
        "green";

    document.getElementById("name").value = "";
    document.getElementById("location").value = "";
    document.getElementById("price").value = "";
    document.getElementById("features").value = "";
    document.getElementById("image_url").value = "";

    await loadProperties();

}


/* LOAD OWNER PROPERTIES */

async function loadProperties() {

    const properties =
        document
        .getElementById("properties");

    const {
        data,
        error
    } =
    await supabaseClient
        .from("accommodations")
        .select("*")
        .eq(
            "owner_id",
            currentUser.id
        )
        .order(
            "id",
            {
                ascending: false
            }
        );

    if (error) {

        console.error(error);

        properties.innerHTML =
            "<p class='empty'>" +
            "Could not load properties: " +
            error.message +
            "</p>";

        return;

    }

    if (
        !data ||
        data.length === 0
    ) {

        properties.innerHTML =
            "<p class='empty'>" +
            "You have not added any accommodation yet." +
            "</p>";

        return;

    }

    properties.innerHTML = "";

    data.forEach(function(property) {

        const card =
            document.createElement("div");

        card.className =
            "property";

        const image =
            property.image_url ||
            "https://images.unsplash.com/photo-1522708323590-d24dbb6b0267?auto=format&fit=crop&w=800&q=80";

        card.innerHTML = `

            <img
                src="${image}"
                alt="Accommodation"
            >

            <div class="property-content">

                <h3>
                    ${property.name}
                </h3>

                <p class="location">
                    📍 ${property.location}
                </p>

                <p class="price">
                    R${property.price} / month
                </p>

                <p class="features">
                    ${property.features || "No features added"}
                </p>

                <button
                    class="delete-button"
                    onclick="deleteAccommodation(${property.id})"
                >
                    Delete
                </button>

            </div>

        `;

        properties.appendChild(card);

    });

}


/* LOAD BOOKINGS */

async function loadBookings() {

    const bookingsContainer =
        document.getElementById("bookings");

    bookingsContainer.innerHTML =
        "<p class='empty'>Loading bookings...</p>";


    /*
       First get this owner's accommodation.
    */

    const {
        data: accommodations,
        error: accommodationError
    } =
    await supabaseClient
        .from("accommodations")
        .select("id, name")
        .eq(
            "owner_id",
            currentUser.id
        );


    if (accommodationError) {

        console.error(accommodationError);

        bookingsContainer.innerHTML =
            "<p class='error'>" +
            "Could not load accommodations: " +
            accommodationError.message +
            "</p>";

        return;

    }


    if (
        !accommodations ||
        accommodations.length === 0
    ) {

        bookingsContainer.innerHTML =
            "<p class='empty'>" +
            "No bookings yet." +
            "</p>";

        return;

    }


    const accommodationIds =
        accommodations.map(function(item) {

            return item.id;

        });


    /*
       Get bookings for those accommodations.
    */

    const {
        data: bookings,
        error: bookingsError
    } =
    await supabaseClient
        .from("bookings")
        .select("*")
        .in(
            "accommodation_id",
            accommodationIds
        )
        .order(
            "id",
            {
                ascending: false
            }
        );


    if (bookingsError) {

        console.error(bookingsError);

        bookingsContainer.innerHTML =
            "<p class='error'>" +
            "Could not load bookings: " +
            bookingsError.message +
            "</p>";

        return;

    }


    if (
        !bookings ||
        bookings.length === 0
    ) {

        bookingsContainer.innerHTML =
            "<p class='empty'>" +
            "No student bookings yet." +
            "</p>";

        return;

    }


    /*
       Get student profiles separately.
    */

    const studentIds =
        bookings
        .map(function(booking) {

            return booking.student_id;

        })
        .filter(Boolean);


    let profiles = [];


    if (studentIds.length > 0) {

        const {
            data: profileData,
            error: profileError
        } =
        await supabaseClient
            .from("profiles")
            .select(
                "id, full_name, phone, student_number, university"
            )
            .in(
                "id",
                studentIds
            );


        if (profileError) {

            console.error(
                "Could not load student profiles:",
                profileError
            );

        } else {

            profiles =
                profileData || [];

        }

    }


    bookingsContainer.innerHTML = "";


    bookings.forEach(function(booking) {

        const accommodation =
            accommodations.find(
                function(item) {

                    return (
                        item.id ===
                        booking.accommodation_id
                    );

                }
            );


        const profile =
            profiles.find(
                function(item) {

                    return (
                        item.id ===
                        booking.student_id
                    );

                }
            );


        const studentName =
            profile &&
            profile.full_name
                ? profile.full_name
                : "Student";


        const studentNumber =
            profile &&
            profile.student_number
                ? profile.student_number
                : "Not provided";


        const phone =
            profile &&
            profile.phone
                ? profile.phone
                : "Not provided";


        const university =
            profile &&
            profile.university
                ? profile.university
                : "Not provided";


        const accommodationName =
            accommodation
                ? accommodation.name
                : "Accommodation";


        const status =
            booking.status ||
            "Pending";


        const card =
            document.createElement("div");

        card.className =
            "booking";


        card.innerHTML = `

            <h3>
                🏠 ${accommodationName}
            </h3>

            <p>
                <strong>Student:</strong>
                ${studentName}
            </p>

            <p>
                <strong>Student Number:</strong>
                ${studentNumber}
            </p>

            <p>
                <strong>University:</strong>
                ${university}
            </p>

            <p>
                <strong>Phone:</strong>
                ${phone}
            </p>

            <p>
                <strong>Move-in Date:</strong>
                ${booking.move_in_date || "Not provided"}
            </p>

            <p>
                <strong>Message:</strong>
                ${booking.message || "No message"}
            </p>

            <div class="booking-status">
                Status: ${status}
            </div>

            <div class="booking-buttons">

                <button
                    class="accept-button"
                    onclick="updateBookingStatus(${booking.id}, 'Accepted')"
                >
                    ✅ Accept
                </button>

                <button
                    class="reject-button"
                    onclick="updateBookingStatus(${booking.id}, 'Rejected')"
                >
                    ❌ Reject
                </button>

            </div>

        `;


        bookingsContainer.appendChild(card);

    });

}


/* UPDATE BOOKING STATUS */

async function updateBookingStatus(
    bookingId,
    newStatus
) {

    const confirmed =
        confirm(
            "Change this booking to " +
            newStatus +
            "?"
        );


    if (!confirmed) {

        return;

    }


    const {
        error
    } =
    await supabaseClient
        .from("bookings")
        .update({
            status: newStatus
        })
        .eq(
            "id",
            bookingId
        );


    if (error) {

        console.error(error);

        alert(
            "Could not update booking: " +
            error.message
        );

        return;

    }


    alert(
        "Booking " +
        newStatus.toLowerCase() +
        " successfully."
    );


    await loadBookings();

}


/* DELETE ACCOMMODATION */

async function deleteAccommodation(id) {

    const confirmed =
        confirm(
            "Are you sure you want to delete this accommodation?"
        );


    if (!confirmed) {

        return;

    }


    const {
        error
    } =
    await supabaseClient
        .from("accommodations")
        .delete()
        .eq(
            "id",
            id
        )
        .eq(
            "owner_id",
            currentUser.id
        );


    if (error) {

        alert(
            "Could not delete accommodation: " +
            error.message
        );

        return;

    }


    alert(
        "Accommodation deleted successfully."
    );


    await loadProperties();

    await loadBookings();

}


/* LOGOUT */

async function logout() {

    await supabaseClient
        .auth
        .signOut();

    window.location.href =
        "login.html";

}


/* START */

checkUser();

</script>

</body>

</html>
```
